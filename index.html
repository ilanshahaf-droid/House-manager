<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מטלות הבית</title>
<meta name="theme-color" content="#5b4bdb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מטלות הבית">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f3ff; --card:#ffffff; --ink:#1e1a3c; --muted:#6c6890; --line:#e6e2f7;
  --primary:#5b4bdb; --primary-ink:#ffffff; --primary-soft:#ece9ff;
  --gold:#f5a50b; --gold-soft:#fff4dc;
  --ok:#17a26b; --ok-soft:#e1f6ec; --bad:#e0454b; --bad-soft:#fde7e8; --warn:#d98a00; --warn-soft:#fff3d6;
  --shadow:0 2px 0 rgba(30,26,60,.04), 0 8px 24px rgba(91,75,219,.08);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:.25rem 0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.shell{max-width:780px;margin:0 auto;padding:16px}
.stack>*+*{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-end{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.grid.stats{grid-template-columns:repeat(3,1fr)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,243,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);display:grid;place-items:center;font-size:22px}
.brand-t{font-weight:800;font-size:1.05rem}
.brand-s{font-size:.8rem;color:var(--muted)}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--primary-soft)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c,#5b4bdb) 18%,white);border:2px solid var(--c,#5b4bdb);flex:none}
.avatar.lg{width:56px;height:56px;font-size:30px}
button.avatar{cursor:pointer;padding:0}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h3{font-size:1.1rem}
.section-t{font-weight:700;font-size:1rem;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:#a86b00}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gray{background:#f0eff5;color:var(--muted)}
.credit{font-weight:800;color:#a86b00;white-space:nowrap}

/* buttons */
.btn{border:0;border-radius:14px;padding:11px 18px;background:var(--primary);color:var(--primary-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.ok{background:var(--ok)} .btn.danger{background:var(--bad)}
.btn.soft-bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:11px}
.btn.big{padding:15px 22px;font-size:1.05rem;width:100%}
.btn.block{width:100%}

/* hero balance */
.hero{background:linear-gradient(135deg,#5b4bdb,#8b5cf6);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.8)}
.hero-num{font-size:2.6rem;font-weight:800;line-height:1}
.hero-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hero-pill{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;font-size:.88rem}
.hero-pill b{font-size:1.05rem}

/* weekly chore */
.week{border:2px solid var(--primary-soft)}
.week.empty{text-align:center;padding:26px 16px}
.week-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.week-main{display:flex;gap:14px;align-items:center}
.big-emoji{font-size:44px;line-height:1;width:64px;height:64px;display:grid;place-items:center;background:var(--primary-soft);border-radius:18px;flex:none}
.week.empty .big-emoji{margin:0 auto 10px}
.dots{display:flex;gap:8px;margin:16px 0 14px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2px dashed #cfc9ee;display:grid;place-items:center;font-size:15px}
.dot.ok{background:var(--ok);border:0;color:#fff}
.dot.wait{background:var(--gold-soft);border:2px solid var(--gold)}
.done-msg{background:var(--ok-soft);color:var(--ok);padding:12px;border-radius:14px;text-align:center;font-weight:700}
.week-foot{display:flex;flex-direction:column;gap:6px;align-items:center}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.item .em{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--primary-soft);display:grid;place-items:center;flex:none}
.item .body{flex:1;min-width:0}
.item .title{font-weight:700}
.item .sub{font-size:.84rem;color:var(--muted);margin-top:2px}
.item.mine{border:2px solid var(--primary);background:#faf9ff}
.item.disabled{opacity:.6}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* rewards */
.rewards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.rewards{grid-template-columns:repeat(3,1fr)}}
.reward{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.reward .em{font-size:40px}
.reward .title{font-weight:700;min-height:2.5em;display:grid;place-items:center}
.reward .cost{font-weight:800;color:#a86b00}
.banner{border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;font-weight:600}
.banner.closed{background:var(--warn-soft);color:#8a5a00}
.banner.open{background:var(--ok-soft);color:var(--ok)}
.banner .ic{font-size:26px}

/* leaderboard */
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.lb-row+.lb-row{border-top:1px solid var(--line)}
.lb-pos{width:24px;text-align:center;font-weight:800;color:var(--muted)}
.lb-bar{flex:1;height:10px;background:var(--primary-soft);border-radius:99px;overflow:hidden}
.lb-bar span{display:block;height:100%;background:var(--primary);border-radius:99px}
.lb-me{font-weight:800}

/* stats */
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem;font-weight:800}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.alert{background:var(--warn-soft);border-color:#f3d9a0}

/* kid cards (admin) */
.kidcard .head{display:flex;gap:12px;align-items:center}
.kidcard .nums{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.kidcard .nums div{font-size:.82rem;color:var(--muted)}
.kidcard .nums b{display:block;font-size:1.2rem;color:var(--ink)}
.kidweek{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.9rem}
.kidweek.none{background:var(--warn-soft);color:#8a5a00}

/* approval */
.appr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.appr .top{display:flex;gap:10px;align-items:center}
.appr .note{margin:10px 0 0;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.9rem}
.appr .acts{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mini{width:72px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;text-align:center}

/* nav */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:780px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;position:relative}
.nav button .ic{font-size:21px;filter:grayscale(1);opacity:.65}
.nav button.on{color:var(--primary);font-weight:700}
.nav button.on .ic{filter:none;opacity:1}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:600;font-size:.9rem}
.field .hint{font-size:.78rem;color:var(--muted)}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.input:focus{border-color:var(--primary)}
textarea.input{min-height:80px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.emoji-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.emo{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer}
.emo.on{border:2px solid var(--primary);background:var(--primary-soft)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.colors button.on{box-shadow:0 0 0 3px var(--ink)}
.seg{display:flex;background:var(--primary-soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--primary);cursor:pointer}
.seg button.on{background:#fff;box-shadow:var(--shadow)}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth .card{width:100%;max-width:400px;padding:26px}
.auth .logo{width:64px;height:64px;font-size:34px;border-radius:20px;margin:0 auto 12px}
.auth h1{text-align:center;font-size:1.5rem}
.auth .sub{text-align:center;color:var(--muted);margin-bottom:20px}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:12px;font-size:.9rem;margin-bottom:12px}
.info{background:var(--primary-soft);color:var(--primary);padding:10px 12px;border-radius:12px;font-size:.9rem;margin-bottom:12px}

/* modal */
#modal-root .overlay{position:fixed;inset:0;background:rgba(30,26,60,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:620px){#modal-root .overlay{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s}
@media(min-width:620px){.modal{border-radius:22px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{font-size:1.15rem}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:.5}}

#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--ok)} #toast.bad{background:var(--bad)}
.empty-state{text-align:center;padding:26px 10px;color:var(--muted)}
.empty-state .e{font-size:38px;margin-bottom:6px}
.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted)}
.spin{width:34px;height:34px;border:4px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs-sub{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tabs-sub button{border:0;background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs-sub button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.month-row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.month-row:first-child{border-top:0}

/* encouragement */
.goal{display:flex;gap:12px;align-items:center}
.goal .em{font-size:30px;width:52px;height:52px;border-radius:16px;background:var(--gold-soft);display:grid;place-items:center;flex:none}
.bar{height:12px;background:var(--primary-soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f97316);border-radius:99px;transition:width .6s}
.welcome{text-align:center}
.welcome .big{font-size:56px;line-height:1;margin:6px 0 10px}
.welcome h3{font-size:1.25rem}
.welcome .box{background:var(--bg);border-radius:16px;padding:14px;margin-top:12px;text-align:right}
.welcome .quote{margin-top:14px;color:var(--primary);font-weight:600}
.cele{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:.95rem}
.cele+.cele{border-top:1px dashed var(--line)}
.days-pick{display:flex;gap:6px;flex-wrap:wrap}
.days-pick label{position:relative}
.days-pick input{position:absolute;opacity:0;pointer-events:none}
.days-pick span{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;cursor:pointer;background:#fff}
.days-pick input:checked+span{background:var(--primary);color:#fff;border-color:var(--primary)}
.status-line{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;font-size:.9rem;font-weight:600;margin-bottom:12px}
.status-line.on{background:var(--ok-soft);color:var(--ok)}
.status-line.off{background:var(--warn-soft);color:#8a5a00}
.reward.goal-on{border:2px solid var(--gold)}
.goal-btn{border:0;background:none;font-size:.78rem;color:var(--muted);cursor:pointer;padding:2px}
.goal-btn.on{color:#a86b00;font-weight:700}
.cell-btn{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;font:inherit;width:100%}
.cell-btn:hover{background:var(--primary-soft)}
.confetti{position:fixed;top:-40px;z-index:70;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

/* update 3 */
.family{border:2px solid #fde3a7;background:linear-gradient(180deg,#fffaf0,#fff)}
.family .head{display:flex;gap:12px;align-items:center}
.family .em{font-size:34px;width:58px;height:58px;border-radius:18px;background:var(--gold-soft);display:grid;place-items:center;flex:none}
.givers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.giver{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:.82rem}
.giver .avatar{width:24px;height:24px;font-size:13px;border-width:1.5px}
.streak-card{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#fff1e6,#fff);border:1px solid #fed7aa;font-weight:600;color:#9a3412}
.streak-card .ic{font-size:28px}
.task{border-inline-start:4px solid var(--gold)}
.ppl{display:flex;gap:4px;align-items:center;margin-top:6px}
.ppl .avatar{width:26px;height:26px;font-size:14px;border-width:1.5px}
.slot{width:26px;height:26px;border-radius:50%;border:1.5px dashed #cfc9ee}
.photo-pick{display:block;cursor:pointer}
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo-btns .photo-box{cursor:pointer}
.photo-box{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border:2px dashed var(--line);border-radius:14px;color:var(--primary);font-weight:600;background:#faf9ff}
.photo-prev{display:block;max-width:100%;max-height:220px;margin:8px auto 0;border-radius:12px}
.appr-photo{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px;background:var(--bg);cursor:zoom-in;min-height:60px}
.praise{margin-top:10px}
.praise .input{padding:9px 12px;font-size:.92rem}
.praise-chips{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.chip-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:.8rem;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip-btn:hover{background:var(--primary-soft)}
.praise-note{font-size:.85rem;color:var(--primary);margin-top:2px}
.sug{display:flex;gap:10px;align-items:center;padding:10px 0}
.sug+.sug{border-top:1px solid var(--line)}
.cert{border-radius:22px;padding:22px 18px;text-align:center;background:radial-gradient(circle at top,#fff8e1,#fff 60%);border:3px double #f5a50b;position:relative}
.cert .ttl{font-size:.85rem;letter-spacing:.08em;color:#a86b00;font-weight:700}
.cert .mon{font-size:1.5rem;font-weight:800;margin:4px 0 12px}
.cert .avatar{margin:0 auto}
.cert .name{font-size:1.35rem;font-weight:800;margin-top:8px}
.cert .badge-t{display:inline-block;margin-top:6px;background:var(--primary);color:#fff;border-radius:999px;padding:5px 14px;font-weight:700}
.cert .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.cert .g div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:.75rem;color:var(--muted)}
.cert .g b{display:block;font-size:1.3rem;color:var(--ink)}
.cert .q{margin-top:14px;font-style:italic;color:var(--primary)}
.cert .sig{margin-top:16px;font-weight:700;color:#a86b00}
</style>
</head>

<div id="modal-root"></div>
<div id="toast"></div>

function ilDate(d = new Date()) {
  return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Jerusalem', year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
}
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function weekStart(d = new Date()) { const s = ilDate(d); const dt = new Date(s + 'T00:00:00Z'); return addDays(s, -dt.getUTCDay()); }
function monthKey(d = new Date()) { return ilDate(d).slice(0,7); }
function monthName(mk) { const [y,m] = mk.split('-').map(Number); return `${HE_MONTHS[m-1]} ${y}`; }
function fmtWeek(ws) { const f = iso => { const [,m,d] = iso.split('-').map(Number); return `${d}.${m}`; }; return `${f(ws)}–${f(addDays(ws,6))}`; }
function fmtDate(iso) { return new Intl.DateTimeFormat('he-IL', {timeZone:'Asia/Jerusalem', day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'}).format(new Date(iso)); }
function prevMonths(n) { const out = []; let [y,m] = monthKey().split('-').map(Number); for (let i=0;i<n;i++){ out.push(`${y}-${String(m).padStart(2,'0')}`); m--; if(!m){m=12;y--;} } return out; }

function toast(msg, type = '') { const t = $('#toast'); t.textContent = msg; t.className = 'show ' + type; clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 2800); }
function errMsg(e) {
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'שם משתמש או סיסמה שגויים';
  if (/already registered|already exists|duplicate key.*username/i.test(m)) return 'שם המשתמש כבר תפוס';
  if (/Password should be/i.test(m)) return 'הסיסמה צריכה להכיל לפחות 6 תווים';
  if (/Email not confirmed/i.test(m)) return 'החשבון ממתין לאימות מייל — יש לכבות Confirm email ב-Supabase';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'אין חיבור לשרת';
  if (/email.*invalid/i.test(m)) return 'Supabase דחה את הכתובת הפנימית — נסו לשנות את EMAIL_DOMAIN';
  return m;
}

function storeInfo() {
  const s = S.settings;
  if (s.store_mode === 'open') return {open:true, text:'החנות פתוחה'};
  if (s.store_mode === 'closed') return {open:false, text:'החנות סגורה כרגע'};
  const [y,m,d] = ilDate().split('-').map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const openFrom = last - s.store_days + 1;
  if (d >= openFrom) return {open:true, text:`החנות פתוחה עד סוף ${HE_MONTHS[m-1]}`};
  const days = openFrom - d;
  return {open:false, days, text: days === 1 ? 'החנות נפתחת מחר!' : `החנות נפתחת בעוד ${days} ימים (${openFrom}.${m})`};
}

/* ---------------- טעינה ---------------- */
async function refresh(silent) {
  try {
    const since = addDays(weekStart(), -7*26);
    const remP = sb.from('ch_reminders').select('*');
    const opt = q => Promise.resolve(q).then(r => r.error ? [] : (r.data || []), () => []);   // טבלאות של עדכון 3 — אם עוד לא הורץ, פשוט ריק
    const extra = Promise.all([
      opt(sb.from('ch_tasks').select('*').order('created_at', {ascending:false}).limit(100)),
      opt(sb.from('ch_task_joins').select('*')),
      opt(sb.from('ch_contributions').select('*').order('created_at', {ascending:false}).limit(1000)),
      S.me && S.me.role === 'admin' ? opt(sb.rpc('ch_price_suggestions')) : Promise.resolve([]),
    ]);
    const [st, pr, ch, se, re, rw, rd, bl, rm] = await Promise.all([
      sb.from('ch_settings').select('*').eq('id',1).maybeSingle(),
      sb.from('ch_profiles').select('*').order('created_at'),
      sb.from('ch_chores').select('*').order('sort').order('created_at'),
      sb.from('ch_selections').select('*').gte('week_start', since),
      sb.from('ch_reports').select('*').order('created_at', {ascending:false}).limit(1000),
      sb.from('ch_rewards').select('*').order('cost'),
      sb.from('ch_redemptions').select('*').order('created_at', {ascending:false}).limit(500),
      sb.rpc('ch_balances'),
      remP,
    ]);
    S.reminders = rm.error ? [] : rm.data;   // אם עדכון 2 עוד לא הורץ — פשוט בלי תזכורות
    [S.tasks, S.joins, S.contribs, S.priceSugs] = await extra;
    if (st.data) S.settings = st.data;
    S.profiles = must(pr); S.chores = must(ch); S.selections = must(se);
    S.reports = must(re); S.rewards = must(rw); S.redemptions = must(rd);
    S.balances = Object.fromEntries((must(bl) || []).map(b => [b.kid_id, b.balance]));
    const me = S.profiles.find(p => p.id === S.me.id); if (me) S.me = me;
    render();
  } catch (e) { console.error(e); if (!silent) toast(errMsg(e), 'bad'); }
}
async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg, 'ok'); await refresh(); return true; }
  catch (e) { console.error(e); toast(errMsg(e), 'bad'); return false; }
}
function subscribeLive() {
  if (liveChan) sb.removeChannel(liveChan);
  const kick = () => { clearTimeout(liveTimer); liveTimer = setTimeout(() => refresh(true), 600); };
  liveChan = sb.channel('ch-live');
  ['ch_reports','ch_redemptions','ch_selections','ch_tasks','ch_task_joins','ch_contributions'].forEach(t => liveChan.on('postgres_changes', {event:'*', schema:'public', table:t}, kick));
  liveChan.subscribe();
}

/* ---------------- התראות (Push) ---------------- */
function b64uToU8(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
async function currentSub() { try { const reg = await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); } catch (_) { return null; } }
async function checkPush() {
  if (!pushSupported()) S.push = 'unsupported';
  else if (Notification.permission === 'denied') S.push = 'denied';
  else S.push = (Notification.permission === 'granted' && await currentSub()) ? 'on' : 'off';
  return S.push;
}
async function enablePush() {
  if (!pushSupported()) throw new Error('הדפדפן הזה לא תומך בהתראות. באייפון צריך קודם "הוספה למסך הבית" ולפתוח משם.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('לא ניתנה הרשאה להתראות. אפשר לאשר בהגדרות האתר בדפדפן.');
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(CONFIG.VAPID_PUBLIC_KEY) });
  const j = sub.toJSON();
  must(await sb.rpc('ch_save_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth }));
  S.push = 'on';
}
async function disablePush() {
  const sub = await currentSub();
  if (sub) { await sb.from('ch_push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe().catch(() => {}); }
  S.push = 'off';
}
function pushBlock(full = true) {
  const st = S.push;
  if (st === 'unsupported') return `<div class="status-line off">⚠️ הדפדפן הזה לא תומך בהתראות. באייפון: "הוספה למסך הבית" ואז לפתוח משם.</div>`;
  if (st === 'denied') return `<div class="status-line off">🔕 ההתראות חסומות בדפדפן. צריך לאשר אותן בהגדרות האתר (סמל המנעול ליד הכתובת).</div>`;
  if (st === 'on') return `<div class="status-line on">🔔 ההתראות פעילות במכשיר הזה</div>${full ? `<div class="row" style="margin-bottom:12px"><button type="button" class="btn sm ghost" data-act="testPush">שליחת התראת בדיקה</button><button type="button" class="btn sm soft-bad" data-act="pushOff">כיבוי במכשיר הזה</button></div>` : ''}`;
  return `<div class="status-line off">🔕 ההתראות כבויות במכשיר הזה</div><button type="button" class="btn block" data-act="pushOn" style="margin-bottom:12px">🔔 הפעלת התראות במכשיר הזה</button>`;
}

/* ---------------- עידוד ---------------- */
const adminName = () => S.profiles.find(p => p.role === 'admin')?.display_name || 'ההורה';
const daysLeftInWeek = () => 6 - new Date(ilDate() + 'T00:00:00Z').getUTCDay();
const daysLeftText = () => { const d = daysLeftInWeek(); return d === 0 ? 'היום היום האחרון בשבוע!' : d === 1 ? 'נשאר רק עוד יום אחד בשבוע' : `נשארו ${d} ימים עד סוף השבוע`; };
function weekDone(kid, ws) {
  const s = curSel(kid, ws), c = s && chore(s.chore_id);
  return !!c && S.reports.filter(r => r.selection_id === s.id && r.status === 'approved').length >= c.times_per_week;
}
function streak(kid) {
  let n = 0, w = weekStart();
  if (weekDone(kid, w)) n++;
  w = addDays(w, -7);
  while (weekDone(kid, w) && n < 60) { n++; w = addDays(w, -7); }
  return n;
}
function goalOf(kid) { const p = prof(kid); const r = p && p.goal_reward_id && S.rewards.find(x => x.id === p.goal_reward_id && x.active); return r || null; }
function goalCard(kid, compact) {
  const g = goalOf(kid), bal = balanceOf(kid);
  if (!g) return compact ? '' : `<div class="card goal"><div class="em">🎯</div><div style="flex:1"><b>עוד אין לך יעד</b><div class="muted small">בוחרים פרס בחנות ורואים כמה נשאר אליו</div></div><button class="btn sm ghost" data-act="tab" data-tab="store">לבחירה</button></div>`;
  const pct = Math.min(100, Math.round(bal / g.cost * 100)), left = g.cost - bal;
  return `<div class="${compact ? 'box' : 'card'} goal"><div class="em">${esc(g.emoji)}</div><div style="flex:1"><div class="row-between"><b>🎯 ${esc(g.title)}</b><span class="credit">${Math.min(bal, g.cost)}/${g.cost}</span></div>
    <div class="bar"><span style="width:${pct}%"></span></div><div class="muted small" style="margin-top:6px">${left > 0 ? `עוד ${left} קרדיטים ליעד` : 'יש לך מספיק קרדיטים! 🎉'}</div></div></div>`;
}
function confetti() {
  const em = ['🎉','⭐','✨','🎊','💜'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; s.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4000);
  }
}
function streakInfo(kid) {
  const N = Math.max(2, S.settings.streak_weeks || 4), B = S.settings.streak_bonus || 0;
  const ws = weekStart(), thisDone = weekDone(kid, ws);
  let prev = 0, w = addDays(ws, -7);
  while (weekDone(kid, w) && prev < 60) { prev++; w = addDays(w, -7); }
  const n = prev + (thisDone ? 1 : 0);
  let msg = '';
  if (B > 0) {
    const wk = k => k === 1 ? 'שבוע אחד' : `${k} שבועות`;
    if (thisDone) {
      const left = N - (n % N);
      msg = n % N === 0 ? `השלמת ${n} שבועות ברצף — הרווחת בונוס של ${B} קרדיטים! 🎉` : `השלמת ${wk(n)} ברצף. עוד ${wk(left)} יזכו אותך בבונוס של ${B} קרדיטים`;
    } else if (prev > 0) {
      const need = N - (prev % N);
      msg = need === 1 ? `השלמת ${wk(prev)} ברצף. השלמת השבוע הזה תזכה אותך בבונוס של ${B} קרדיטים!` : `השלמת ${wk(prev)} ברצף. עוד ${need} שבועות (כולל השבוע) לבונוס של ${B} קרדיטים`;
    } else msg = `${N} שבועות ברצף של מטלה שהושלמה = בונוס של ${B} קרדיטים. מתחילים השבוע!`;
  }
  return { n, prev, thisDone, N, B, msg };
}
function streakCard(kid) { const si = streakInfo(kid); return si.msg ? `<div class="card streak-card"><span class="ic">🔥</span><div>${esc(si.msg)}</div></div>` : ''; }

/* תעודה חודשית — זמינה מהערב (19:00) שלפני פתיחת החנות, ותמיד לחודשים קודמים */
function certAvailable(mk = monthKey()) {
  if (mk < monthKey()) return true;
  const [y, m] = mk.split('-').map(Number), last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const openFrom = last - (S.settings.store_days || 3) + 1, d = +ilDate().slice(8);
  const h = +new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Jerusalem', hour:'2-digit', hourCycle:'h23' }).format(new Date());
  return d > openFrom - 1 || (d === openFrom - 1 && h >= 19);
}
function certStats(kid, mk) {
  const inM = r => monthKey(new Date(r.reviewed_at || r.created_at)) === mk;
  const appr = S.reports.filter(r => r.kid_id === kid && r.status === 'approved' && inM(r));
  const weeks = [...new Set(S.selections.filter(s => s.kid_id === kid && addDays(s.week_start, 3).slice(0, 7) === mk).map(s => s.week_start))];
  const st = {
    chores: appr.filter(r => r.kind === 'chore').length,
    tasks: appr.filter(r => r.kind === 'task').length,
    earned: appr.reduce((a, r) => a + r.credits, 0),
    weeks: weeks.length, done: weeks.filter(w => weekDone(kid, w)).length,
    gave: S.contribs.filter(c => c.kid_id === kid && monthKey(new Date(c.created_at)) === mk).reduce((a, c) => a + c.amount, 0),
    praises: [...new Set(appr.map(r => r.admin_note).filter(Boolean))].slice(0, 3),
    streak: streakInfo(kid).n,
  };
  st.title = st.weeks >= 3 && st.done === st.weeks ? '🏆 אלופ/ת המטלות' : st.tasks >= 2 ? '⚡ כוכב/ת הבונוסים' : st.gave > 0 ? '🤝 שחקן/ית קבוצה' : st.done >= 2 ? '💪 מתמיד/ה' : st.chores > 0 ? '⭐ עוזר/ת הבית' : '🌱 החודש הבא שלך!';
  return st;
}
function certHtml(kid, mk) {
  const k = prof(kid), st = certStats(kid, mk), cur = mk === monthKey();
  return `<div class="cert"><div class="ttl">📜 תעודת סיכום חודשית</div><div class="mon">${monthName(mk)}</div>

    <div class="g"><div><b>${st.chores}</b>ביצועים שאושרו</div><div><b>${st.done}/${st.weeks}</b>שבועות מושלמים</div><div><b>⭐ ${st.earned}</b>קרדיטים</div>
      <div><b>⚡ ${st.tasks}</b>משימות בונוס</div><div><b>🤝 ${st.gave}</b>לקופה המשפחתית</div><div><b>🔥 ${st.streak}</b>שבועות ברצף</div></div>
    ${st.praises.length ? st.praises.map(p => `<div class="q">״${esc(p)}״</div>`).join('') : ''}

/* תמונות */
async function compressImage(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('לא הצלחתי לקרוא את התמונה')); i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
}
async function uploadPhoto(file) {
  const blob = await compressImage(file);
  const path = `${S.me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  must(await sb.storage.from('ch-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false }));
  return path;
}
function photoField(required) {
  return `<div class="field"><label>📷 תמונה ${required ? '<span style="color:var(--bad)">(חובה במטלה הזו)</span>' : '(לא חובה)'}</label>
    <div class="photo-btns"><label class="photo-box"><input type="file" data-photo-in accept="image/*" capture="environment" hidden>📷 צילום עכשיו</label><label class="photo-box"><input type="file" data-photo-in accept="image/*" hidden>🖼️ מהגלריה</label></div>
    <img class="photo-prev" hidden alt="">
    <span class="hint">התמונה נמחקת אוטומטית אחרי שהדיווח מאושר</span></div>`;
}
function wirePhoto(m) {
  m.querySelectorAll('[data-photo-in]').forEach(inp => inp.onchange = () => {
    const f = inp.files[0], img = m.querySelector('.photo-prev'); if (!f) return;
    m._photo = f; img.src = URL.createObjectURL(f); img.hidden = false;
  });
}
async function submitReport(m, base, required, okMsg) {
  const f = m.querySelector('form'), btn = f.querySelector('[type=submit]'), file = m._photo || null;
  if (required && !file) return toast('צריך לצרף תמונה 📷', 'bad');
  btn.disabled = true; btn.textContent = file ? 'מעלה תמונה…' : 'שולח…';
  const ok = await run(async () => {
    const photo_path = file ? await uploadPhoto(file) : null;
    must(await sb.from('ch_reports').insert({ ...base, kid_id: S.me.id, note: f.note.value.trim() || null, photo_path }));
  }, okMsg);
  if (ok) closeModal(); else { btn.disabled = false; btn.textContent = '📨 שליחה לאישור'; }
}
function loadPhotos() {
  document.querySelectorAll('img[data-photo]').forEach(async img => {
    const p = img.dataset.photo, c = S.photoUrls[p];
    if (c && c.exp > Date.now()) { if (img.src !== c.url) img.src = c.url; return; }
    const { data } = await sb.storage.from('ch-photos').createSignedUrl(p, 900);
    if (data) { S.photoUrls[p] = { url: data.signedUrl, exp: Date.now() + 840000 }; img.src = data.signedUrl; }
    else img.replaceWith(Object.assign(document.createElement('div'), { className: 'muted small', textContent: '📷 התמונה כבר לא זמינה' }));
  });
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }

    ${(() => { const mine = openTasks().filter(t => taskJoins(t.id).some(j => j.kid_id === me.id) && !taskClaim(t.id)); const free = openTasks().filter(t => !taskJoins(t.id).some(j => j.kid_id === me.id) && taskJoins(t.id).length < t.max_people); return mine.length ? `<div class="box">⚡ המשימה שלך: <b>${esc(mine[0].title)}</b> — אל תשכח/י לדווח כשמסיימים</div>` : free.length ? `<div class="box">⚡ יש ${free.length === 1 ? 'משימת בונוס פתוחה' : free.length + ' משימות בונוס פתוחות'} — <a href="#chores">להצצה</a></div>` : ''; })()}

async function boot() {
  if (CONFIG.SUPABASE_URL.includes('YOUR-')) {
    $('#app').innerHTML = `<div class="auth"><div class="card"><div class="logo">🏠</div><h1>כמעט מוכן</h1><p class="sub">צריך להזין בקובץ index.html את כתובת ה-Supabase ואת ה-anon key (בראש הסקריפט, באובייקט CONFIG).</p></div></div>`;
    return;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {auth:{storageKey:'matalot-auth'}});
  const { data:{ session } } = await sb.auth.getSession();
  if (session) return enter();
  showAuth();
}

async function showAuth(error) {
  const { data:hasAdmin, error:e } = await sb.rpc('ch_has_admin');
  if (e) {
    $('#app').innerHTML = `<div class="auth"><div class="card"><div class="logo">⚠️</div><h1>אין חיבור למסד הנתונים</h1><p class="sub">${esc(errMsg(e))}<br>ודאו שהרצתם את schema.sql בפרויקט.</p><button class="btn block" onclick="location.reload()">נסו שוב</button></div></div>`;
    return;
  }
  hasAdmin ? renderLogin(error) : renderSetup(error);
}

function renderLogin(error) {
  $('#app').innerHTML = `<div class="auth"><form class="card" id="loginF">
    <div class="logo">🏠</div><h1>מטלות הבית</h1><p class="sub">כניסה עם שם משתמש וסיסמה</p>
    ${error ? `<div class="err">${esc(error)}</div>` : ''}
    <div class="field"><label>שם משתמש</label><input class="input" name="u" autocomplete="username" autocapitalize="none" dir="ltr" required></div>
    <div class="field"><label>סיסמה</label><input class="input" name="p" type="password" autocomplete="current-password" dir="ltr" required></div>
    <button class="btn big" type="submit">כניסה</button></form></div>`;
  $('#loginF').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target; const b = f.querySelector('button'); b.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: toEmail(f.u.value), password: f.p.value });
    if (error) { b.disabled = false; return renderLogin(errMsg(error)); }

  };
}

function renderSetup(error) {
  $('#app').innerHTML = `<div class="auth"><form class="card" id="setupF">
    <div class="logo">👑</div><h1>הגדרה ראשונה</h1><p class="sub">יצירת חשבון המנהל (ההורה)</p>
    ${error ? `<div class="err">${esc(error)}</div>` : ''}
    <div class="field"><label>השם שלך</label><input class="input" name="n" required placeholder="אבא"></div>
    <div class="field"><label>שם משתמש</label><input class="input" name="u" dir="ltr" autocapitalize="none" required><span class="hint">אותיות באנגלית, ספרות, נקודה או מקף (3–20)</span></div>
    <div class="field"><label>סיסמה</label><input class="input" name="p" type="password" dir="ltr" minlength="6" required></div>
    <button class="btn big" type="submit">יצירת מנהל</button></form></div>`;
  $('#setupF').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target; const u = f.u.value.trim().toLowerCase();
    if (!USER_RE.test(u)) return renderSetup('שם המשתמש צריך להיות באנגלית, 3–20 תווים');
    f.querySelector('button').disabled = true;
    let { data, error } = await sb.auth.signUp({ email: toEmail(u), password: f.p.value });
    if (error && /already registered/i.test(error.message)) ({ data, error } = await sb.auth.signInWithPassword({ email: toEmail(u), password: f.p.value }));
    if (error) return renderSetup(errMsg(error));
    if (!data.session) return renderSetup('החשבון נוצר אבל ממתין לאימות מייל. כבו את "Confirm email" ב-Supabase (Authentication → Sign In / Providers → Email) ונסו שוב.');
    const r = await sb.rpc('ch_bootstrap_admin', { p_username: u, p_display: f.n.value.trim() });
    if (r.error) return renderSetup(errMsg(r.error));
    enter();
  };
}

async function enter() {
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return showAuth();
  const { data:p } = await sb.from('ch_profiles').select('*').eq('id', user.id).maybeSingle();
  if (!p || !p.active) {
    $('#app').innerHTML = `<div class="auth"><div class="card"><div class="logo">🔒</div><h1>אין גישה</h1><p class="sub">${p ? 'החשבון הושבת ע״י המנהל.' : 'החשבון הזה לא רשום באפליקציה.'}</p><button class="btn block" onclick="logout()">יציאה</button></div></div>`;
    return;
  }
  S.me = p; S.tab = p.role === 'admin' ? 'overview' : 'home';
  await refresh(); subscribeLive();
  await checkPush();
  if (S.push === 'on') { const sub = await currentSub(); if (sub) { const j = sub.toJSON(); sb.rpc('ch_save_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth }).then(() => {}); } }
  if (p.role === 'kid' && !S.reminders.length) {   // תזכורת ברירת מחדל לילד חדש
    const r = await sb.from('ch_reminders').insert({ kid_id: p.id }).select();
    if (!r.error) S.reminders = r.data;
  }
  render();
  if (location.hash.length > 1) goHash(location.hash);
  else if (p.role === 'kid') showWelcome();
}
async function logout() {
  if (liveChan) sb.removeChannel(liveChan);
  try { await disablePush(); } catch (_) {}   // מכשיר משותף — שלא יקבל התראות של המשתמש הקודם
  await sb.auth.signOut(); S.me = null; closeModal(); showAuth();
}

function leaderboard(meId) {
  const ks = kids(); if (ks.length < 2) return '';
  const rows = ks.map(k => ({k, v:monthEarned(k.id)})).sort((a,b) => b.v - a.v);
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="section-t">🏆 הלוח המשפחתי · ${HE_MONTHS[+monthKey().slice(5)-1]}</div>
    <div class="card">${rows.map((r,i) => `<div class="lb-row ${r.k.id===meId?'lb-me':''}"><span class="lb-pos">${i+1}</span><span class="avatar" style="--c:${r.k.color};width:32px;height:32px;font-size:17px">${esc(r.k.avatar)}</span><span style="min-width:64px">${esc(r.k.display_name)}</span><div class="lb-bar"><span style="width:${Math.round(r.v/max*100)}%"></span></div><span class="credit">⭐ ${r.v}</span></div>`).join('')}</div>`;
}

function kidHome() {
  const me = S.me, st = storeInfo();
  const pend = S.reports.filter(r => r.kid_id === me.id && r.status === 'pending').reduce((a,r) => a + r.credits, 0);
  const recent = S.reports.filter(r => r.kid_id === me.id).slice(0, 5);
  const stk = streak(me.id), rem = S.reminders.find(r => r.kid_id === me.id);
  const remText = !rem || !rem.enabled ? 'התזכורות כבויות' : `תזכורת ב-${rem.time} · ימים ${rem.days.slice().sort().map(d => DAY_LETTERS[d]).join(' ')}`;
  return `<div class="stack">
    <div class="card hero">
      <div class="muted small">שלום ${esc(me.display_name)} ${esc(me.avatar)} · היתרה שלך</div>
      <div class="row" style="margin-top:6px"><span class="hero-num">${balanceOf(me.id)}</span><span style="font-size:1.6rem">⭐</span></div>
      <div class="hero-row">
        <div class="hero-pill">החודש צברת <b>${monthEarned(me.id)}</b></div>
        ${pend ? `<div class="hero-pill">ממתין לאישור <b>${pend}</b></div>` : ''}
        ${stk ? `<div class="hero-pill">🔥 <b>${stk}</b> ${stk === 1 ? 'שבוע' : 'שבועות'} ברצף</div>` : ''}
        <div class="hero-pill">🛍️ ${esc(st.text)}</div>
      </div>
    </div>
    ${weeklyCard(me.id, true)}
    ${streakCard(me.id)}
    ${(() => {
      const mine = openTasks().filter(t => taskJoins(t.id).some(j => j.kid_id === me.id));
      const free = openTasks().filter(t => !taskJoins(t.id).some(j => j.kid_id === me.id) && taskJoins(t.id).length < t.max_people && !taskClaim(t.id));
      if (mine.length) return mine.map(t => taskItem(t, me.id)).join('');
      return free.length ? `<div class="card row-between task"><div><b>⚡ ${free.length === 1 ? 'משימת בונוס פתוחה' : free.length + ' משימות בונוס פתוחות'}</b><div class="muted small">${esc(free[0].emoji || '')} ${esc(free[0].title)} · ⭐ ${free[0].credits}</div></div><button class="btn sm" data-act="tab" data-tab="chores">להצצה</button></div>` : '';
    })()}
    ${certAvailable() ? `<div class="card row-between" style="border:2px solid var(--gold)"><div><b>📜 תעודת הסיכום של ${HE_MONTHS[+monthKey().slice(5) - 1]} מוכנה!</b><div class="muted small">בואו לראות כמה הספקת החודש</div></div><button class="btn sm" data-act="cert" data-id="${me.id}" data-month="${monthKey()}">לתעודה</button></div>` : ''}
    ${goalCard(me.id)}
    ${familyRewards().map(r => familyCard(r, true)).join('')}
    <div class="card row-between"><div class="row"><span style="font-size:26px">${S.push === 'on' && rem && rem.enabled ? '🔔' : '🔕'}</span><div><b>תזכורות</b><div class="muted small">${S.push === 'on' ? esc(remText) : 'ההתראות לא מופעלות במכשיר הזה'}</div></div></div><button class="btn sm ghost" data-act="reminders" data-id="${me.id}">הגדרה</button></div>
  </div>
  ${leaderboard(me.id)}
  <div class="section-t">פעילות אחרונה</div>
  ${recent.length ? `<div class="list">${recent.map(r => `<div class="item"><div class="em">${repEmoji(r)}</div><div class="body"><div class="title">${esc(r.title)}</div><div class="sub">${fmtDate(r.created_at)}${r.admin_note ? ' · ' + esc(r.admin_note) : ''}</div></div><div class="side"><span class="credit">${r.credits>0?'+':''}${r.credits}</span>${statusChip(r.status)}</div></div>`).join('')}</div>` : empty('🌱', 'עוד אין פעילות — בחרו מטלה והתחילו!')}`;
}

function taskItem(t, kidId) {
  const js = taskJoins(t.id), joined = js.some(j => j.kid_id === kidId), claim = taskClaim(t.id), full = js.length >= t.max_people;
  const share = Math.floor(t.credits / Math.max(js.length + (joined || full ? 0 : 1), 1));
  let btn;
  if (claim) btn = `<span class="chip warn">⏳ ממתין לאישור</span>`;
  else if (joined) btn = `<button class="btn sm" data-act="reportTask" data-id="${t.id}">✋ סיימנו!</button><button class="btn sm ghost" data-act="leaveTask" data-id="${t.id}">עזיבה</button>`;
  else if (full) btn = `<button class="btn sm ghost" disabled>מלא</button>`;
  else btn = `<button class="btn sm" data-act="joinTask" data-id="${t.id}">${js.length ? '🤝 הצטרפות' : '🙋 אני לוקח/ת'}</button>`;
  return `<div class="item task ${joined ? 'mine' : ''}"><div class="em">${esc(t.emoji || '⚡')}</div><div class="body">
    <div class="title">${esc(t.title)}</div>${t.description ? `<div class="sub">${esc(t.description)}</div>` : ''}
    <div class="chips"><span class="chip gold">⭐ ${t.credits}${t.max_people > 1 ? ' לחלוקה' : ''}</span>${t.max_people > 1 ? `<span class="chip gray">👥 עד ${t.max_people} · ~${share} לכל אחד</span>` : ''}${t.deadline ? `<span class="chip gray">⏰ עד ${fmtDay(t.deadline)}</span>` : ''}${t.photo_required ? '<span class="chip gray">📷 עם תמונה</span>' : ''}</div>
    ${t.max_people > 1 || js.length ? `<div class="ppl">${js.map(j => { const k = prof(j.kid_id); return k ? `<span class="avatar" style="--c:${k.color}" title="${esc(k.display_name)}">${esc(k.avatar)}</span>` : ''; }).join('')}${Array.from({ length: Math.max(0, t.max_people - js.length) }, () => '<span class="slot"></span>').join('')}</div>` : ''}
  </div><div class="side">${btn}</div></div>`;
}

function kidChores() {
  const me = S.me, ws = weekStart(), sel = curSel(me.id);
  const locked = sel && selReps(sel).length > 0;
  const list = choresFor(me.id);
  const tasks = openTasks();
  return `${tasks.length ? `<h2>⚡ משימות בונוס</h2><p class="muted" style="margin-bottom:12px">משימות חד-פעמיות מעבר למטלה השבועית. במשימה משותפת — הקרדיטים מתחלקים בין כל המשתתפים.</p><div class="list" style="margin-bottom:22px">${tasks.map(t => taskItem(t, me.id)).join('')}</div>` : ''}
  <h2>בחירת מטלה שבועית</h2>
    <p class="muted" style="margin-bottom:14px">שבוע ${fmtWeek(ws)} · בוחרים מטלה אחת לשבוע. ${locked ? 'כבר דיווחת על המטלה שלך, אז השבוע אי אפשר להחליף.' : 'אפשר להחליף עד הדיווח הראשון.'}</p>
    ${list.length ? `<div class="list">${list.map(c => {
      const mine = sel && sel.chore_id === c.id;
      const others = S.selections.filter(s => s.chore_id === c.id && s.week_start === ws && s.kid_id !== me.id).map(s => prof(s.kid_id)).filter(Boolean);
      const taken = c.exclusive && others.length;
      let btn;
      if (mine) btn = `<span class="chip ok">✓ שלי השבוע</span>`;
      else if (taken) btn = `<button class="btn sm ghost" disabled>תפוסה</button>`;
      else if (locked) btn = `<button class="btn sm ghost" disabled>נעול</button>`;
      else btn = `<button class="btn sm" data-act="pick" data-id="${c.id}">${sel ? 'החלפה' : 'בחירה'}</button>`;
      return `<div class="item ${mine?'mine':''} ${taken&&!mine?'disabled':''}"><div class="em">${esc(c.emoji)}</div><div class="body">
        <div class="title">${esc(c.title)}</div>${c.description ? `<div class="sub">${esc(c.description)}</div>` : ''}
        <div class="chips"><span class="chip gold">⭐ ${c.credits}${c.times_per_week>1?' × '+c.times_per_week:''}</span>${c.times_per_week>1?`<span class="chip gray">עד ${c.times_per_week} פעמים בשבוע</span>`:''}${c.exclusive?'<span class="chip gray">🔒 לילד אחד</span>':''}${c.photo_required?'<span class="chip gray">📷 עם תמונה</span>':''}${others.length?`<span class="chip">${taken?'נבחרה ע״י':'גם'} ${others.map(o=>esc(o.display_name)).join(', ')}</span>`:''}</div>
      </div><div class="side">${btn}</div></div>`; }).join('')}</div>` : empty('📭', 'עדיין אין מטלות זמינות')}`;
}

function kidStore() {
  const me = S.me, st = storeInfo(), bal = balanceOf(me.id);
  const mine = S.redemptions.filter(r => r.kid_id === me.id).slice(0, 10);
  const rewards = S.rewards.filter(r => r.active && !r.shared);
  return `<div class="row-between" style="margin-bottom:12px"><h2>חנות הקרדיטים</h2><span class="chip gold" style="font-size:.95rem">יש לך ⭐ ${bal}</span></div>
    ${familyRewards().length ? `<div class="stack" style="margin-bottom:14px">${familyRewards().map(r => familyCard(r)).join('')}</div>` : ''}
    <div class="banner ${st.open?'open':'closed'}"><span class="ic">${st.open?'🛍️':'⏰'}</span><div>${esc(st.text)}${st.open?'':'<div class="small" style="font-weight:400">בינתיים אפשר להסתכל ולתכנן 😉 (לקופה המשפחתית אפשר לתרום תמיד)</div>'}</div></div>
    <div class="rewards" style="margin-top:14px">${rewards.map(r => {
      const out = r.stock !== null && r.stock <= 0;
      const can = st.open && !out && bal >= r.cost;
      const missing = r.cost - bal;
      const isGoal = me.goal_reward_id === r.id;
      return `<div class="reward ${isGoal?'goal-on':''}"><div class="em">${esc(r.emoji)}</div><div class="title">${esc(r.title)}</div>${r.description?`<div class="muted small">${esc(r.description)}</div>`:''}<div class="cost">⭐ ${r.cost}</div>
        <button class="goal-btn ${isGoal?'on':''}" data-act="setGoal" data-id="${isGoal?'':r.id}">${isGoal?'🎯 היעד שלי':'🎯 לקבוע כיעד'}</button>
        ${out ? '<span class="chip gray">אזל</span>' : r.stock !== null ? `<span class="muted small">נשארו ${r.stock}</span>` : ''}
        <button class="btn sm ${can?'':'ghost'}" ${can?'':'disabled'} data-act="buy" data-id="${r.id}">${!st.open?'סגור':missing>0?`חסרים ${missing}`:'קנייה'}</button></div>`; }).join('') || empty('🎁', 'החנות עוד ריקה')}</div>
    <div class="section-t">הבקשות שלי</div>
    ${mine.length ? `<div class="list">${mine.map(r => `<div class="item"><div class="em">${esc(r.emoji||'🎁')}</div><div class="body"><div class="title">${esc(r.title)}</div><div class="sub">${fmtDate(r.created_at)}${r.admin_note?' · '+esc(r.admin_note):''}</div></div><div class="side"><span class="credit">-${r.cost}</span>${r.status==='approved'?'<span class="chip ok">התקבל 🎉</span>':statusChip(r.status)}${r.status==='pending'?`<button class="btn sm soft-bad" data-act="cancelBuy" data-id="${r.id}">ביטול</button>`:''}</div></div>`).join('')}</div>` : empty('🛒', 'עוד לא ביקשת פרסים')}`;
}

function activityList(kidId, limit = 40) {
  const items = [
    ...S.contribs.filter(c => c.kid_id === kidId).map(c => { const r = S.rewards.find(x => x.id === c.reward_id); return {t:c.created_at, html:`<div class="item"><div class="em">🤝</div><div class="body"><div class="title">תרומה לקופה: ${esc(r?.title || 'פרס משפחתי')}</div><div class="sub">${fmtDate(c.created_at)}</div></div><div class="side"><span class="credit">-${c.amount}</span></div></div>`}; }),
    ...S.reports.filter(r => r.kid_id === kidId).map(r => ({t:r.created_at, html:`<div class="item"><div class="em">${repEmoji(r)}</div><div class="body"><div class="title">${esc(r.title)}</div><div class="sub">${fmtDate(r.created_at)}${r.note?' · "'+esc(r.note)+'"':''}${r.admin_note?' · '+esc(r.admin_note):''}</div></div><div class="side"><span class="credit">${r.credits>0?'+':''}${r.credits}</span>${statusChip(r.status)}</div></div>`})),
    ...S.redemptions.filter(r => r.kid_id === kidId).map(r => ({t:r.created_at, html:`<div class="item"><div class="em">${esc(r.emoji||'🎁')}</div><div class="body"><div class="title">🛍️ ${esc(r.title)}</div><div class="sub">${fmtDate(r.created_at)}${r.admin_note?' · '+esc(r.admin_note):''}</div></div><div class="side"><span class="credit">-${r.cost}</span>${statusChip(r.status)}</div></div>`})),
  ].sort((a,b) => b.t.localeCompare(a.t)).slice(0, limit);
  return items.length ? `<div class="list">${items.map(i => i.html).join('')}</div>` : empty('📭', 'אין עדיין פעילות');
}
function monthsTable(kidId) {
  return `<div class="card">${prevMonths(6).map(mk => `<div class="month-row"><span>${monthName(mk)}</span><span><span class="credit">+${monthEarned(kidId, mk)}</span> <span class="muted">· נוצלו ${monthSpent(kidId, mk)}</span></span></div>`).join('')}</div>`;
}
function kidHistory() {
  return `<h2>ההיסטוריה שלי</h2><div class="section-t">📜 התעודות שלי</div><div class="card">${certButtons(S.me.id)}</div><div class="section-t">סיכום חודשי</div>${monthsTable(S.me.id)}<div class="section-t">כל הפעילות</div>${activityList(S.me.id)}`;
}

const KID_VIEWS = { home:kidHome, chores:kidChores, store:kidStore, history:kidHistory };

/* =====================================================================
   מסכי מנהל
   ===================================================================== */
function adminOverview() {
  const ks = kids(), ws = weekStart(), st = storeInfo();
  const pend = pendingReports().length + pendingRedemptions().length;
  const noPick = ks.filter(k => !curSel(k.id)).length;
  return `<div class="grid stats">
      <div class="stat ${pend?'alert':''}" data-act="tab" data-tab="approvals" style="cursor:pointer"><b>${pend}</b><span>ממתינים לאישור</span></div>
      <div class="stat ${noPick?'alert':''}"><b>${ks.length - noPick}/${ks.length}</b><span>בחרו מטלה השבוע</span></div>
      <div class="stat"><b>${ks.reduce((a,k) => a + monthEarned(k.id), 0)}</b><span>קרדיטים החודש</span></div>
    </div>
    <div class="banner ${st.open?'open':'closed'}" style="margin-top:12px"><span class="ic">${st.open?'🛍️':'⏰'}</span><div>${esc(st.text)}</div></div>
    <div class="section-t"><span>הילדים · שבוע ${fmtWeek(ws)}</span></div>
    ${ks.length ? `<div class="grid two">${ks.map(k => {
      const sel = curSel(k.id), c = sel && chore(sel.chore_id), reps = sel ? selReps(sel) : [];
      const ok = reps.filter(r => r.status==='approved').length, wait = reps.filter(r => r.status==='pending').length;
      const kp = S.reports.filter(r => r.kid_id===k.id && r.status==='pending').length + S.redemptions.filter(r => r.kid_id===k.id && r.status==='pending').length;
      return `<div class="card kidcard"><div class="head"><span class="avatar lg" style="--c:${k.color}">${esc(k.avatar)}</span><div style="flex:1"><h3>${esc(k.display_name)}</h3>${kp?`<span class="chip warn">${kp} ממתינים</span>`:'<span class="muted small">הכל מאושר</span>'}</div></div>
        <div class="nums"><div><b>⭐ ${balanceOf(k.id)}</b>יתרה</div><div><b>${monthEarned(k.id)}</b>נצבר החודש</div><div><b>${monthSpent(k.id)}</b>נוצל החודש</div></div>
        ${c ? `<div class="kidweek">${esc(c.emoji)} <b>${esc(c.title)}</b> · בוצע ${ok}/${c.times_per_week}${wait?` · <span style="color:var(--warn)">${wait} ממתינים</span>`:''}</div>` : `<div class="kidweek none">⚠️ עוד לא נבחרה מטלה השבוע</div>`}
        <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn sm ghost" data-act="editSel" data-id="${k.id}" data-week="${ws}">${c ? '✏️ שינוי / ביטול מטלה' : '➕ שיבוץ מטלה'}</button><button class="btn sm ghost" data-act="bonus" data-id="${k.id}">± בונוס/קנס</button><button class="btn sm ghost" data-act="kidHist" data-id="${k.id}">היסטוריה</button>${(() => { const r = S.reminders.find(x => x.kid_id === k.id); return `<button class="btn sm ghost" data-act="reminders" data-id="${k.id}">${r && r.enabled ? '🔔 ' + esc(r.time) : '🔕'}</button>`; })()}${streak(k.id) >= 2 ? `<span class="chip gold">🔥 ${streak(k.id)} ברצף</span>` : ''}</div></div>`; }).join('')}</div>` : `<div class="card">${empty('👧', 'עוד אין ילדים — מוסיפים בלשונית "ילדים"')}</div>`}
    ${pastWeeks()}`;
}

function pastWeeks() {
  const ks = kids(); if (!ks.length) return '';
  const weeks = [1,2,3,4].map(i => addDays(weekStart(), -7*i));
  return `<div class="section-t">שבועות קודמים</div><div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.88rem">
    <tr><th style="text-align:right;padding:6px">שבוע</th>${ks.map(k => `<th style="padding:6px">${esc(k.avatar)} ${esc(k.display_name)}</th>`).join('')}</tr>
    ${weeks.map(w => `<tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px;white-space:nowrap">${fmtWeek(w)}</td>${ks.map(k => { const s = curSel(k.id, w), c = s && chore(s.chore_id); const inner = !s ? '<span class="muted">—</span>' : `${esc(c?.emoji||'❔')} ${S.reports.filter(r => r.selection_id === s.id && r.status === 'approved').length}/${c?.times_per_week ?? '?'}`; return `<td style="text-align:center"><button class="cell-btn" data-act="editSel" data-id="${k.id}" data-week="${w}">${inner}</button></td>`; }).join('')}</tr>`).join('')}
  </table><p class="muted small" style="margin:8px 4px 0">לחיצה על משבצת — שינוי או ביטול הבחירה של אותו שבוע</p></div>`;
}

function adminApprovals() {
  const reps = pendingReports(), reds = pendingRedemptions();
  const reviewed = [...S.reports.filter(r => r.status !== 'pending' && (r.kind === 'chore' || (r.kind === 'task' && r.reviewed_at))).map(r => ({...r, _t:'r'})), ...S.redemptions.filter(r => r.status !== 'pending').map(r => ({...r, _t:'d'}))]
    .sort((a,b) => (b.reviewed_at||b.created_at).localeCompare(a.reviewed_at||a.created_at)).slice(0, 15);
  const kidTag = id => { const k = prof(id); return k ? `<span class="avatar" style="--c:${k.color};width:34px;height:34px;font-size:18px">${esc(k.avatar)}</span>` : ''; };
  return `<div class="section-t" style="margin-top:4px"><span>דיווחי ביצוע (${reps.length})</span>${reps.length > 1 ? `<button class="btn sm ok" data-act="approveAll">אישור הכל</button>` : ''}</div>
    ${reps.length ? `<div class="list">${reps.map(r => {
      const isTask = r.kind === 'task', js = isTask ? taskJoins(r.task_id) : [], n = Math.max(js.length, 1);
      return `<div class="appr ${isTask ? 'task' : ''}"><div class="top">${kidTag(r.kid_id)}<div style="flex:1"><div style="font-weight:700">${esc(prof(r.kid_id)?.display_name)} · ${isTask ? '⚡ משימת בונוס: ' : esc(chore(r.chore_id)?.emoji||'') + ' '}${esc(r.title)}</div><div class="muted small">${fmtDate(r.created_at)}${r.week_start && !isTask ?' · שבוע '+fmtWeek(r.week_start):''}</div></div></div>
      ${isTask ? `<div class="note row-between"><span>👥 ${js.map(j => esc(prof(j.kid_id)?.display_name || '')).join(', ') || 'אין משתתפים'} · ${n > 1 ? `מתחלקים: ~${Math.floor(r.credits / n)} לכל אחד` : 'לבד'}</span><button class="btn sm ghost" data-act="editTask" data-id="${r.task_id}">✏️ תיקון משתתפים</button></div>` : ''}
      ${r.note ? `<div class="note">💬 ${esc(r.note)}</div>` : ''}
      ${r.photo_path ? `<img class="appr-photo" data-photo="${esc(r.photo_path)}" data-act="viewPhoto" alt="תמונה מהדיווח">` : ''}
      <div class="praise"><input class="input" id="pr-${r.id}" maxlength="140" placeholder="💬 חיזוק מילולי (לא חובה) — מגיע לילד עם האישור"><div class="praise-chips">${PRAISES.map(p => `<button type="button" class="chip-btn" data-act="praise" data-id="${r.id}" data-p="${esc(p)}">${p}</button>`).join('')}</div></div>

const ADMIN_VIEWS = { overview:adminOverview, approvals:adminApprovals, chores:adminChores, store:adminStore, kids:adminKids, settings:adminSettings };

/* =====================================================================
   פעולות
   ===================================================================== */
const ACT = {
  bg: (d, el, e) => { if (e.target === el) closeModal(); },
  closeModal,
  refresh: () => refresh().then(() => toast('עודכן')),
  tab: d => { closeModal(); S.tab = d.tab; render(); window.scrollTo(0,0); },

  /* ----- התראות ותזכורות ----- */
  async pushOn(d, el) {
    el.disabled = true;
    try { await enablePush(); toast('ההתראות הופעלו 🔔', 'ok'); }
    catch (e) { toast(errMsg(e), 'bad'); await checkPush(); }
    rerenderOpen();
  },
  async pushOff() { await disablePush(); toast('ההתראות כובו במכשיר הזה'); rerenderOpen(); },
  async testPush() {
    const r = await sb.rpc('ch_test_push');
    if (r.error) return toast(errMsg(r.error), 'bad');
    toast('נשלחה התראת בדיקה — אמורה להגיע תוך כמה שניות', 'ok');
  },
  reminders(d) {
    const k = prof(d.id), mine = k.id === S.me.id;
    const r = S.reminders.find(x => x.kid_id === k.id) || { enabled:true, time:'17:00', days:[0,1,2,3,4,5] };
    const m = openModal(mine ? '🔔 תזכורות' : `🔔 תזכורות של ${k.display_name}`, `
      ${mine ? pushBlock() : `<p class="muted small" style="margin-bottom:12px">כדי שהתזכורת תגיע, ${esc(k.display_name)} צריך/ה להפעיל התראות בטלפון שלו/ה (בדף הבית → תזכורות).</p>`}
      <form id="remF">
        <label class="check"><input type="checkbox" name="enabled" ${r.enabled ? 'checked' : ''}> לשלוח תזכורת יומית</label>
        <div class="field" style="margin-top:8px"><label>באיזו שעה?</label><input class="input" type="time" name="time" value="${esc(r.time)}" style="width:140px" required></div>
        <div class="field"><label>באילו ימים?</label><div class="days-pick">${DAY_LETTERS.map((l, i) => `<label><input type="checkbox" name="day" value="${i}" ${r.days.includes(i) ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
        <p class="muted small">התזכורת נשלחת רק אם המטלה של השבוע עוד לא בוצעה (או שעוד לא נבחרה מטלה). היא יכולה להגיע עד רבע שעה אחרי השעה שנקבעה.</p>
        <div class="row-end"><button class="btn" type="submit">שמירה</button></div>
      </form>`);
    S.reopen = () => ACT.reminders(d);
    m.querySelector('#remF').onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target;
      const days = [...f.querySelectorAll('[name=day]:checked')].map(x => +x.value);
      if (f.enabled.checked && !days.length) return toast('צריך לבחור לפחות יום אחד', 'bad');
      const ok = await run(async () => must(await sb.from('ch_reminders').upsert({ kid_id: k.id, enabled: f.enabled.checked, time: f.time.value.slice(0,5), days, last_sent_on: null, updated_at: new Date().toISOString() })), 'התזכורת נשמרה');
      if (ok) closeModal();
    };
  },
  async setGoal(d) {
    await run(async () => must(await sb.rpc('ch_set_goal', { p_reward: d.id || null })), d.id ? '🎯 היעד נקבע!' : 'היעד הוסר');
  },

  /* ----- מנהל: שינוי / ביטול בחירה שבועית ----- */
  editSel(d) {
    const k = prof(d.id), ws = d.week || weekStart(), sel = curSel(k.id, ws), cur = sel && chore(sel.chore_id);
    const reps = sel ? S.reports.filter(r => r.selection_id === sel.id) : [];
    const appr = reps.filter(r => r.status === 'approved').length, pend = reps.filter(r => r.status === 'pending').length;
    const list = choresFor(k.id);
    const taken = c => c.exclusive && S.selections.some(s => s.chore_id === c.id && s.week_start === ws && s.kid_id !== k.id);
    const m = openModal(`${k.avatar} ${k.display_name} · שבוע ${fmtWeek(ws)}`, `
      ${cur ? `<div class="card" style="margin-bottom:12px"><div class="row"><span style="font-size:28px">${esc(cur.emoji)}</span><div><b>${esc(cur.title)}</b><div class="muted small">${appr} אושרו${pend ? ` · ${pend} ממתינים` : ''}</div></div></div></div>` : `<p class="muted" style="margin-bottom:12px">עוד לא נבחרה מטלה לשבוע הזה.</p>`}
      <div class="section-t" style="margin-top:0">${cur ? 'החלפה למטלה אחרת' : 'בחירת מטלה'}</div>
      ${cur && appr ? `<p class="muted small" style="margin-bottom:8px">דיווחים שכבר אושרו נשארים עם הקרדיטים שלהם.</p>` : ''}
      <div class="list">${list.map(c => `<button class="item ${c.id === cur?.id ? 'mine' : ''} ${taken(c) ? 'disabled' : ''}" style="cursor:pointer;text-align:right;width:100%" data-cid="${c.id}" ${c.id === cur?.id || taken(c) ? 'disabled' : ''}><div class="em">${esc(c.emoji)}</div><div class="body"><div class="title">${esc(c.title)}</div>${taken(c) ? '<div class="sub">תפוסה השבוע ע״י ילד אחר</div>' : ''}</div><span class="credit">⭐ ${c.credits}${c.times_per_week > 1 ? '×' + c.times_per_week : ''}</span></button>`).join('')}</div>
      ${sel ? `<div class="row-end"><button class="btn soft-bad block" id="cancelSel">🗑️ ביטול הבחירה לשבוע הזה</button></div>` : ''}`);
    m.querySelectorAll('[data-cid]').forEach(b => b.onclick = async () => {
      const ok = await run(async () => must(sel
        ? await sb.from('ch_selections').update({ chore_id: b.dataset.cid }).eq('id', sel.id)
        : await sb.from('ch_selections').insert({ kid_id: k.id, chore_id: b.dataset.cid, week_start: ws })), sel ? 'המטלה הוחלפה' : 'המטלה שובצה');
      if (ok) closeModal();
    });
    const cb = m.querySelector('#cancelSel');
    if (cb) cb.onclick = async () => {
      const msg = `לבטל את הבחירה של ${esc(k.display_name)} לשבוע ${fmtWeek(ws)}?${pend ? `<br>${pend} דיווחים שממתינים לאישור יימחקו.` : ''}${appr ? `<br>${appr} דיווחים שאושרו נשארים, עם הקרדיטים.` : ''}${ws === weekStart() ? '<br>הילד/ה יוכל/תוכל לבחור מטלה חדשה.' : ''}`;
      if (!(await confirmBox('ביטול בחירה', msg, 'ביטול הבחירה', 'danger'))) return;
      await run(async () => {
        must(await sb.from('ch_reports').delete().eq('selection_id', sel.id).eq('status', 'pending'));
        must(await sb.from('ch_selections').delete().eq('id', sel.id));
      }, 'הבחירה בוטלה');
    };
  },

  account() {

  contribute(d) {
    const r = S.rewards.find(x => x.id === d.id), left = r.cost - poolOf(r), bal = balanceOf(S.me.id), max = Math.min(left, bal);
    if (max <= 0) return toast(bal <= 0 ? 'אין לך כרגע קרדיטים לתרום' : 'הקופה כבר מלאה! 🎉', 'bad');
    const quick = [5, 10, 20, 50].filter(v => v < max);
    const m = openModal('🤝 תרומה לקופה המשפחתית', `${familyCard(r, true)}
      <form id="ctF" style="margin-top:14px"><div class="field"><label>כמה קרדיטים לתרום? <span class="muted small">(יש לך ${bal}, חסרים לקופה ${left})</span></label>

    const del = m.querySelector('#del');
    if (del) del.onclick = async () => {
      if (!(await confirmBox('מחיקת מטלה', 'המחיקה תמחק גם את הבחירות שלה (הקרדיטים שאושרו נשמרים). כדי רק להסתיר — עדיף לבטל את "פעילה".', 'מחיקה', 'danger'))) return;
      await run(async () => must(await sb.from('ch_chores').delete().eq('id', d.id)), 'נמחק');
    };
  },

  /* ----- מנהל: חנות ----- */
  editReward(d) {
    const r = d.id ? S.rewards.find(x => x.id === d.id) : { title:'', description:'', emoji:'🎁', cost:20, stock:null, active:true };
    const m = openModal(d.id ? 'עריכת פרס' : 'פרס חדש', `<form id="rF">
      <div class="field"><label>שם הפרס</label><input class="input" name="title" value="${esc(r.title)}" required maxlength="60"></div>
      <div class="field"><label>אייקון</label>${emojiPicker('emoji', r.emoji, REWARD_EMOJIS)}</div>
      <div class="field"><label>תיאור (לא חובה)</label><input class="input" name="description" value="${esc(r.description||'')}" maxlength="140"></div>
      <div class="grid two"><div class="field"><label>מחיר בקרדיטים</label><input class="input" type="number" min="1" name="cost" value="${r.cost}" required></div>
      <div class="field"><label>מלאי</label><input class="input" type="number" min="0" name="stock" value="${r.stock ?? ''}" placeholder="ללא הגבלה"></div></div>
      <label class="check"><input type="checkbox" name="shared" ${r.shared?'checked':''}> 🏡 פרס משפחתי — כל הילדים חוסכים ביחד לקופה משותפת</label>
      <label class="check"><input type="checkbox" name="active" ${r.active?'checked':''}> מוצג בחנות</label>
      <div class="row-end">${d.id ? `<button type="button" class="btn soft-bad" id="del">מחיקה</button>` : ''}<button class="btn" type="submit">שמירה</button></div></form>`);
    wirePickers(m);
    m.querySelector('#rF').onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target;
      const row = { title: f.title.value.trim(), emoji: f.emoji.value.trim() || '🎁', description: f.description.value.trim() || null, cost: +f.cost.value, stock: f.stock.value === '' ? null : +f.stock.value, active: f.active.checked, ...('streak_weeks' in S.settings ? { shared: f.shared.checked } : {}) };
      const ok = await run(async () => must(d.id ? await sb.from('ch_rewards').update(row).eq('id', d.id) : await sb.from('ch_rewards').insert(row)), 'נשמר');
      if (ok) closeModal();
    };
    const del = m.querySelector('#del');
    if (del) del.onclick = async () => {
      if (!(await confirmBox('מחיקת פרס', 'למחוק את הפרס? בקשות קודמות נשמרות בהיסטוריה.', 'מחיקה', 'danger'))) return;
      await run(async () => must(await sb.from('ch_rewards').delete().eq('id', d.id)), 'נמחק');
    };
  },

  /* ----- מנהל: ילדים ----- */
  editKid(d) {
    const isNew = !d.id;
    const k = isNew ? { display_name:'', username:'', avatar: AVATARS[kids(true).length % AVATARS.length], color: COLORS[(kids(true).length + 1) % COLORS.length], active:true } : prof(d.id);
    const m = openModal(isNew ? 'הוספת ילד' : `עריכה · ${k.display_name}`, `<form id="kF">
      <div class="field"><label>שם</label><input class="input" name="display_name" value="${esc(k.display_name)}" required maxlength="30"></div>
      ${isNew ? `<div class="field"><label>שם משתמש לכניסה</label><input class="input" name="username" dir="ltr" autocapitalize="none" required><span class="hint">באנגלית: אותיות, ספרות, נקודה או מקף (3–20)</span></div>
      <div class="field"><label>סיסמה</label><input class="input" name="password" dir="ltr" minlength="6" required><span class="hint">לפחות 6 תווים. אפשר לאפס בכל עת.</span></div>` : ''}
      <div class="field"><label>אווטאר</label>${emojiPicker('avatar', k.avatar, AVATARS)}</div>
      <div class="field"><label>צבע</label><input type="hidden" name="color" value="${k.color}"><div class="colors" data-for="color">${COLORS.map(c => `<button type="button" data-c="${c}" class="${c===k.color?'on':''}" style="background:${c}"></button>`).join('')}</div></div>
      ${!isNew ? `<label class="check"><input type="checkbox" name="active" ${k.active?'checked':''}> החשבון פעיל</label>` : ''}
      <div class="row-end"><button class="btn" type="submit">${isNew ? 'יצירת חשבון' : 'שמירה'}</button></div></form>`);
    wirePickers(m);
    m.querySelector('#kF').onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target, btn = f.querySelector('[type=submit]'); btn.disabled = true;
      const base = { display_name: f.display_name.value.trim(), avatar: f.avatar.value.trim() || '🙂', color: f.color.value };
      let ok;
      if (isNew) {
        const u = f.username.value.trim().toLowerCase();
        if (!USER_RE.test(u)) { btn.disabled = false; return toast('שם המשתמש צריך להיות באנגלית, 3–20 תווים', 'bad'); }
        if (S.profiles.some(p => p.username === u)) { btn.disabled = false; return toast('שם המשתמש כבר תפוס', 'bad'); }
        ok = await run(async () => {
          const tmp = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'matalot-tmp' } });
          const { data, error } = await tmp.auth.signUp({ email: toEmail(u), password: f.password.value });
          if (error) throw error;
          if (!data.user || (data.user.identities && data.user.identities.length === 0)) throw new Error('שם המשתמש כבר קיים במערכת');
          must(await sb.from('ch_profiles').insert({ id: data.user.id, username: u, role:'kid', ...base }));
          if (!data.session) toast('נוצר — אבל צריך לכבות Confirm email ב-Supabase כדי שהילד יוכל להיכנס', 'bad');
        }, `החשבון של ${base.display_name} נוצר 🎉`);
      } else {
        ok = await run(async () => must(await sb.from('ch_profiles').update({ ...base, active: f.active.checked }).eq('id', d.id)), 'נשמר');
      }
      if (ok) closeModal(); else btn.disabled = false;
    };
  },
  setPass(d) {
    const k = prof(d.id);
    const m = openModal(`סיסמה חדשה ל${k.display_name}`, `<form id="spF"><p class="muted small" style="margin-bottom:10px">שם המשתמש: <b dir="ltr">${esc(k.username)}</b></p><div class="field"><label>סיסמה חדשה</label><input class="input" name="p" dir="ltr" minlength="6" required></div><button class="btn big" type="submit">עדכון</button></form>`);
    m.querySelector('#spF').onsubmit = async ev => {
      ev.preventDefault();
      const ok = await run(async () => must(await sb.rpc('ch_admin_set_password', { p_kid: k.id, p_password: ev.target.p.value })), 'הסיסמה עודכנה');
      if (ok) closeModal();
    };
  },
};

async function approveOne(r) {
  if (!r) return;
  const v = parseInt($('#cr-' + r.id)?.value, 10), note = ($('#pr-' + r.id)?.value || '').trim() || null;
  if (r.kind === 'task') return must(await sb.rpc('ch_review_task', { p_report: r.id, p_approve: true, p_note: note, p_total: isNaN(v) ? r.credits : v }));
  must(await sb.from('ch_reports').update({ status:'approved', credits: isNaN(v) ? r.credits : v, admin_note: note, reviewed_at: new Date().toISOString() }).eq('id', r.id));
}
function reasonModal(title, placeholder, fn, okMsg) {
  const m = openModal(title, `<form id="rsF"><div class="field"><label>הסבר לילד (לא חובה)</label><input class="input" name="n" maxlength="140" placeholder="${esc(placeholder)}"></div><button class="btn danger big" type="submit">דחייה</button></form>`);
  m.querySelector('#rsF').onsubmit = async ev => { ev.preventDefault(); const ok = await run(() => fn(ev.target.n.value.trim() || null), okMsg); if (ok) closeModal(); };
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'setF') return; e.preventDefault(); const f = e.target;
  run(async () => must(await sb.from('ch_settings').update({ family_name: f.family_name.value.trim() || 'מטלות הבית', store_mode: f.store_mode.value, store_days: Math.min(15, Math.max(1, +f.store_days.value || 3)), ...('streak_weeks' in S.settings ? { streak_weeks: Math.min(12, Math.max(2, +f.streak_weeks.value || 4)), streak_bonus: Math.min(500, Math.max(0, +f.streak_bonus.value || 0)) } : {}) }).eq('id', 1)), 'ההגדרות נשמרו');
});
document.addEventListener('click', e => {
  const b = e.target.closest('#modeSeg button'); if (!b) return;
  document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelector('#setF [name=store_mode]').value = b.dataset.v;
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>
